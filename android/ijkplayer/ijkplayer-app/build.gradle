apply plugin: 'com.android.application'

android {
    compileSdkVersion project.compileSdkVersion
    buildToolsVersion project.buildToolsVersion


    defaultConfig {
        applicationId "cn.transcodegroup.ijkplayerapp"
        minSdkVersion 21
        targetSdkVersion project.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    if (isModuleAsApp.toBoolean()) {
        compile ijkplayerLib('ijkplayer-view', true)
    } else {
        compile project(':ijkplayer-view')
    }
    compile ijkplayerLib('ijkplayer-arm64')

    testCompile "junit:junit:4.12"
    androidTestCompile('androidx.test.ext:junit:1.1.1')
}
